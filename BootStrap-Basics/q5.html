<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Blog</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q5.css">
</head>
<body>
<header class="bg-primary text-white p-4">
    <div class="container">
        <h1>Tech World</h1>
        <p>Simple articles about modern technology</p>
    </div>
</header>
<main class="container py-5">
    <h2 class="text-center mb-4">Latest Posts</h2>
    <div class="row g-4">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body">
                    <h3 class="card-title">Introduction to AI</h3>
                    <p class="card-text">
                        Artificial Intelligence is changing the way
                        people work and solve problems.
                    </p>
                    <button class="btn btn-primary">Read More</button>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body">
                    <h3 class="card-title">Future of Web Development</h3>
                    <p class="card-text">
                        Modern web technologies help developers
                        create faster and better websites.
                    </p>
                    <button class="btn btn-primary">Read More</button>
                </div>
            </div>
        </div>
    </div>
</main>
<footer class="bg-dark text-white text-center p-4">
    <p class="mb-0">© 2026 Tech World Blog</p>
</footer>
</body>
</html>
