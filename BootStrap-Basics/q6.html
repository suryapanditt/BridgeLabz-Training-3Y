<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q6.css">
</head>
<body>
<header class="bg-dark text-white text-center p-4">
    <h1>Notifications Dashboard</h1>
</header>
<main class="container py-5">
    <div class="card p-4">
        <div class="alert alert-success">
            You have received a new message.
        </div>
        <div class="alert alert-info">
            Your profile is 80% complete.
        </div>
        <div class="alert alert-danger">
            Your password will expire soon.
        </div>
        <div class="alert alert-warning alert-dismissible fade show">
            Remember to update your account details.
            <button type="button" class="btn-close"
                    data-bs-dismiss="alert"></button>
        </div>
        <section class="summary p-4 mt-3">
            <h3>Summary</h3>
            <p>You have 4 new notifications today.</p>
            <p>2 messages are waiting for your response.</p>
        </section>
    </div>
</main>
<footer class="bg-dark text-white text-center p-3">
    © 2026 Notification Center
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
