<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="q2.css">
</head>
<body class="bg-light text-dark">

<header class="text-center mt-4">
    <h1 class="fw-bold">Suryansh Tripathi</h1>
    <p>Computer Science Student & Aspiring Data Scientist</p>
</header>

<main>
    <section class="container text-center p-5">
        <img src="MY-Photo.png" width="180" height="180"
             class="img-fluid rounded-circle mb-3"
             alt="Profile">

        <h2 class="fw-bold">Hello, I'm Suryansh</h2>

        <p>
            I am interested in Data Science, Artificial Intelligence
            and Web Development.
        </p>

        <button class="btn btn-primary me-2">Hire Me</button>
        <button class="btn btn-outline-dark">Download CV</button>

        <div class="row mt-4">
            <div class="col-md-6 mx-auto">
                <h3 class="mb-3">Contact Me</h3>

                <form>
                    <input type="text" class="form-control mb-3"
                           placeholder="Your Name">

                    <input type="email" class="form-control mb-3"
                           placeholder="Your Email">

                    <textarea class="form-control mb-3"
                              placeholder="Your Message"></textarea>

                    <button class="btn btn-success">Send Message</button>
                </form>
            </div>
        </div>
    </section>
</main>

<footer class="text-center bg-dark text-white p-3">
    <p class="mb-0">© 2026 My Portfolio</p>
</footer>

</body>
</html>
