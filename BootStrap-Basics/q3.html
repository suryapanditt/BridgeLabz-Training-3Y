<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="q3.css">
</head>
<body>
<header class="bg-dark text-white text-center p-4">
    <h1>My Online Store</h1>
    <p>Quality products at affordable prices</p>
</header>
<main class="container py-5">
    <h2 class="text-center mb-4">Our Products</h2>
    <div class="row g-4">
        <div class="col-12 col-sm-6 col-md-3">
            <div class="card shadow-sm product-card">
                <img src="https://via.placeholder.com/300"
                     class="card-img-top" alt="Headphones">
                <div class="card-body">
                    <h5>Headphones</h5>
                    <p>₹1,499</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
            <div class="card shadow-sm product-card">
                <img src="https://via.placeholder.com/300"
                     class="card-img-top" alt="Smart Watch">
                <div class="card-body">
                    <h5>Smart Watch</h5>
                    <p>₹2,499</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
            <div class="card shadow-sm product-card">
                <img src="https://via.placeholder.com/300"
                     class="card-img-top" alt="Keyboard">
                <div class="card-body">
                    <h5>Keyboard</h5>
                    <p>₹999</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
            <div class="card shadow-sm product-card">
                <img src="https://via.placeholder.com/300"
                     class="card-img-top" alt="Mouse">
                <div class="card-body">
                    <h5>Wireless Mouse</h5>
                    <p>₹699</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>
    </div>
</main>
<footer class="bg-dark text-white text-center p-3">
    © 2026 My Online Store
</footer>
</body>
</html>
