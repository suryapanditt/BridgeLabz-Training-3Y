<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel World</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q10.css">
</head>
<body>
<header class="bg-dark text-white text-center p-4">
    <h1>Travel World</h1>
    <p>Explore beautiful destinations</p>
</header>
<main>
    <section class="container py-4">
        <div id="travelCarousel"
             class="carousel slide"
             data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active"
                     data-bs-interval="3000">
                    <img src="https://via.placeholder.com/1200x500"
                         class="d-block w-100"
                         alt="Goa">
                    <div class="carousel-caption">
                        <h3>Goa</h3>
                        <p>Enjoy beautiful beaches and sunsets.</p>
                    </div>
                </div>
                <div class="carousel-item"
                     data-bs-interval="3000">
                    <img src="https://via.placeholder.com/1200x500"
                         class="d-block w-100"
                         alt="Manali">
                    <div class="carousel-caption">
                        <h3>Manali</h3>
                        <p>Experience mountains and peaceful valleys.</p>
                    </div>
                </div>
                <div class="carousel-item"
                     data-bs-interval="3000">
                    <img src="https://via.placeholder.com/1200x500"
                         class="d-block w-100"
                         alt="Jaipur">
                    <div class="carousel-caption">
                        <h3>Jaipur</h3>
                        <p>Discover history, culture and beautiful forts.</p>
                    </div>
                </div>
            </div>
            <button class="carousel-control-prev"
                    type="button"
                    data-bs-target="#travelCarousel"
                    data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next"
                    type="button"
                    data-bs-target="#travelCarousel"
                    data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>
        <section class="mt-5">
            <h3>Booking Completion</h3>
            <div class="progress">
                <div class="progress-bar progress-bar-striped progress-bar-animated"
                     style="width: 70%;">
                    70%
                </div>
            </div>
        </section>
    </section>
</main>
<footer class="bg-dark text-white text-center p-4 mt-5">
    <p>Contact: travelworld@example.com</p>
    <p class="mb-0">Phone: +91 98765 43210</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
