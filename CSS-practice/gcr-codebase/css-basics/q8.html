<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="q8.css">
</head>
<body>
    <header class="dashboard-header">
        <h1>Admin Dashboard</h1>
    </header>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Users</a>
                <a href="#">Projects</a>
                <a href="#">Settings</a>
            </nav>
        </aside>
        <main class="dashboard-main">
            <h2>Overview</h2>
            <section class="content-boxes">
                <article class="box">
                    <h3>Total Users</h3>
                    <p>1,250</p>
                    <p>
                        Users currently registered.
                    </p>
                </article>
                <article class="box">
                    <h3>Active Projects</h3>
                    <p>42</p>
                    <p>
                        Projects currently in progress.
                    </p>
                </article>
            </section>
        </main>
    </div>
</body>
</html>
