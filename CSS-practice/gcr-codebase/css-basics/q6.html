<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="q6.css">
</head>
<body>
    <main class="gallery-page">
        <h1>My Photo Gallery</h1>
        <section class="gallery">
            <figure class="photo">
                <img
                    src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=700&q=80"
                    alt="Mountain landscape"
                >
                <figcaption>Mountain Escape</figcaption>
            </figure>
            <figure class="photo">
                <img
                    src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=700&q=80"
                    alt="Beach"
                >
                <figcaption>Sunny Beach</figcaption>
            </figure>
            <figure class="photo">
                <img
                    src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=700&q=80"
                    alt="Snow mountains"
                >
                <figcaption>Snowy Peaks</figcaption>
            </figure>
            <figure class="photo">
                <img
                    src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=700&q=80"
                    alt="Forest"
                >
                <figcaption>Green Forest</figcaption>
            </figure>
            <figure class="photo">
                <img
                    src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=700&q=80"
                    alt="Desert road"
                >
                <figcaption>Desert Road</figcaption>
            </figure>
            <figure class="photo">
                <img
                    src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=700&q=80"
                    alt="Mountain lake"
                >
                <figcaption>Mountain Lake</figcaption>
            </figure>
        </section>
    </main>
</body>
</html>
