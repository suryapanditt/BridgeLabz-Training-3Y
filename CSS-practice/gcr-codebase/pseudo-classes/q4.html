<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors</title>
    <link rel="stylesheet" href="q4.css">
</head>
<body>

    <header>
        <h1>CSS Selectors Practice</h1>
    </header>

    <main>

        <p>This is an element selector.</p>

        <p class="special">This uses a class selector.</p>

        <p id="unique">This uses an ID selector.</p>

        <input type="text" placeholder="Attribute selector">

        <div>
            <p>Child paragraph</p>
            <span>
                <p>Descendant paragraph</p>
            </span>
        </div>

        <p class="first">First paragraph</p>
        <p>Second paragraph</p>
        <p>Third paragraph</p>

        <a href="#">Click Here</a>

    </main>

    <footer>
        <p>CSS Practice Page</p>
    </footer>

</body>
</html>
