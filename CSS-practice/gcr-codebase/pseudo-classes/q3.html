<!DOCTYPE html>
<html>
<head>
    <title>Image Showcase</title>
    <link rel="stylesheet" href="q3.css">
</head>
<body>

    <h1>Image Showcase</h1>

    <main>

        <figure>
            <div class="image">
                <img src="https://picsum.photos/400/300?1" alt="Image 1">
            </div>
            <figcaption>Nature</figcaption>
        </figure>

        <figure>
            <div class="image">
                <img src="https://picsum.photos/400/300?2" alt="Image 2">
            </div>
            <figcaption>Mountain</figcaption>
        </figure>

        <figure>
            <div class="image">
                <img src="https://picsum.photos/400/300?3" alt="Image 3">
            </div>
            <figcaption>City</figcaption>
        </figure>

        <figure>
            <div class="image">
                <img src="https://picsum.photos/400/300?4" alt="Image 4">
            </div>
            <figcaption>Forest</figcaption>
        </figure>

        <figure>
            <div class="image">
                <img src="https://picsum.photos/400/300?5" alt="Image 5">
            </div>
            <figcaption>Beach</figcaption>
        </figure>

        <figure>
            <div class="image">
                <img src="https://picsum.photos/400/300?6" alt="Image 6">
            </div>
            <figcaption>Road</figcaption>
        </figure>

    </main>

</body>
</html>
