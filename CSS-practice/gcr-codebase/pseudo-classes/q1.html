<!DOCTYPE html>
<html>
<head>
    <title>Pseudo Classes</title>
    <link rel="stylesheet" href="q1.css">
</head>
<body>

    <h1>Pseudo Classes</h1>

    <main>

        <div class="example">
            <a href="#">Hover Me</a>
            <p>:hover changes the link when mouse is over it.</p>
        </div>

        <div class="example">
            <input type="text" placeholder="Click here">
            <p>:focus works when the input is selected.</p>
        </div>

        <div class="example">
            <button>Click Me</button>
            <p>:active works while the button is being clicked.</p>
        </div>

        <div class="example">
            <ul>
                <li>First Item</li>
                <li>Second Item</li>
                <li>Third Item</li>
            </ul>
            <p>:nth-child() selects a specific list item.</p>
        </div>

    </main>

</body>
</html>
