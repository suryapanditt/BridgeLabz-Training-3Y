<!DOCTYPE html>
<html>
<head>
    <title>Box Sizing</title>
    <link rel="stylesheet" href="q8.css">
</head>
<body>

    <main>

        <section>
            <h2>Default Box</h2>

            <div class="default">
                Width = 250px<br>
                Padding = 30px
            </div>

            <p>
                Default box-sizing adds padding and border
                outside the given width.
            </p>
        </section>

        <section>
            <h2>Border Box</h2>

            <div class="borderbox">
                Width = 250px<br>
                Padding = 30px
            </div>

            <p>
                Border-box includes padding and border
                inside the given width.
            </p>
        </section>

    </main>

</body>
</html>
