<!DOCTYPE html>
<html>
<head>
    <title>Typography</title>
    <link rel="stylesheet" href="q7.css">
</head>
<body>

    <article>

        <h1>My Article</h1>

        <p class="one">
            This paragraph uses a different font family.
            Typography makes a webpage easier to read.
        </p>

        <p class="two">
            This is another paragraph with different
            font size and letter spacing.
        </p>

        <p>
            This is <mark>important</mark> text.
            This is <strong>strong text</strong>.
            This is <em>emphasized text</em>.
        </p>

    </article>

</body>
</html>
