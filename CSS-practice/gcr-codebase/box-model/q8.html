<!DOCTYPE html>
<html>
<head>
    <title>Box Model</title>
    <link rel="stylesheet" href="q8.css">
</head>
<body>

    <h1>CSS Box Model</h1>

    <main>

        <div class="margin">
            Margin

            <div class="border">
                Border

                <div class="padding">
                    Padding

                    <div class="content">
                        Content
                    </div>

                </div>

            </div>

        </div>

    </main>

    <p>
        Content is the actual text or element.
        Padding is the space around content.
        Border surrounds the padding.
        Margin is the space outside the border.
    </p>

    <h2>Box Sizing Example</h2>

    <div class="sizes">
        <div class="default">Default box</div>
        <div class="borderbox">Border-box</div>
    </div>

</body>
</html>
