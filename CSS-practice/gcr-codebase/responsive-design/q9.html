<!DOCTYPE html>
<html>
<head>
    <title>Responsive Design Principles</title>
    <link rel="stylesheet" href="q9.css">
</head>
<body>

    <h1>Responsive Design Principles</h1>

    <main>

        <section>
            <h2>Fluid Layouts</h2>

            <p>
                Fluid layouts use flexible sizes instead of fixed sizes.
            </p>

            <code>
                width: 100%;
            </code>
        </section>

        <section>
            <h2>Flexible Media</h2>

            <p>
                Images should adjust according to the screen size.
            </p>

            <code>
                max-width: 100%;
            </code>
        </section>

        <section>
            <h2>Breakpoints</h2>

            <p>
                Breakpoints change the layout at different screen sizes.
            </p>

            <code>
                @media (max-width: 600px)
            </code>
        </section>

    </main>

</body>
</html>
