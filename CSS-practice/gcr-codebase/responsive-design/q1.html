<!DOCTYPE html>
<html>
<head>
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="q1.css">
</head>
<body>

    <header>
        <h1>Image Filter Gallery</h1>
    </header>

    <main class="gallery">

        <figure>
            <img class="blur" src="https://picsum.photos/400/300?1" alt="Image 1">
            <figcaption>Blur</figcaption>
        </figure>

        <figure>
            <img class="gray" src="https://picsum.photos/400/300?2" alt="Image 2">
            <figcaption>Grayscale</figcaption>
        </figure>

        <figure>
            <img class="sepia" src="https://picsum.photos/400/300?3" alt="Image 3">
            <figcaption>Sepia</figcaption>
        </figure>

        <figure>
            <img class="bright" src="https://picsum.photos/400/300?4" alt="Image 4">
            <figcaption>Brightness</figcaption>
        </figure>

        <figure>
            <img class="contrast" src="https://picsum.photos/400/300?5" alt="Image 5">
            <figcaption>Contrast</figcaption>
        </figure>

        <figure>
            <img class="hue" src="https://picsum.photos/400/300?6" alt="Image 6">
            <figcaption>Hue Rotate</figcaption>
        </figure>

    </main>

</body>
</html>
