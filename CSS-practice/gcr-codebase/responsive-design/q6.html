<!DOCTYPE html>
<html>
<head>
    <title>Responsive CSS Cheat Sheet</title>
    <link rel="stylesheet" href="q6.css">
</head>
<body>

    <h1>Responsive CSS Cheat Sheet</h1>

    <main>

        <section class="box">
            <h2>Filters</h2>
            <p>filter: grayscale(100%);</p>
        </section>

        <section class="box">
            <h2>Media Queries</h2>
            <p>@media (max-width: 700px)</p>
        </section>

        <section class="box">
            <h2>Responsive Design</h2>
            <p>Use flexible layouts for different screens.</p>
        </section>

        <section class="box">
            <h2>Typography</h2>
            <p>font-size: clamp(1rem, 2vw, 2rem);</p>
        </section>

    </main>

</body>
</html>
