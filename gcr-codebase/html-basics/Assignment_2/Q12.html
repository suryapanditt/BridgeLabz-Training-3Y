<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inline Formatting</title>
</head>
<body>
    <p>
        <strong>Learning</strong>
        <em>Web Development</em>
        is an
        <mark>important skill</mark>
        for my career.<br>
        I practice it regularly.
        <small>Keep learning!</small>
    </p>
</body>
</html>
