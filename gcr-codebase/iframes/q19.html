<!DOCTYPE html>
<html>
<head>
    <title>Form Security</title>
</head>
<body>

    <h2>Secure Form</h2>

    <form autocomplete="off">

        Username:
        <input type="text" required>
        <br><br>

        Password:
        <input type="password" required>
        <br><br>

        <input type="submit" value="Submit">

    </form>

    <p>
        Turning off autocomplete can improve security because the browser
        will not automatically store and fill sensitive information.
    </p>

</body>
</html>
