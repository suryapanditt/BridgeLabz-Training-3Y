<!DOCTYPE html>
<html>
<head>
    <title>HTML Entities</title>
</head>
<body>

    <p>
        Less Than: &lt;
        <br>

        Greater Than: &gt;
        <br>

        Ampersand: &amp;
        <br>

        Single Quote: &apos;

        Trademark: &trade;
        <br>

        Registered: &reg;
